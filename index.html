<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2537">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PureWash">
<title>PureWash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy sidebar app shell on a cool gray page with white cards. Bottom tab bar for crew on phones; details open in a side sheet. */
:root{
  --c1:#2B5190; --c2:#B8892A;
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#172033; --muted:#5B6576; --line:#DFE3E9;
  --accent:#2B5190; --accent-ink:#FFFFFF; --accent-soft:#E6EDF8;
  --mark:#8C6D25; --mark-soft:#F4EDDC; --mark-ink:#6A5118;
  --good:#2F6B3B; --good-soft:#E3F0E5; --warn:#9A5B12; --warn-soft:#FBEEDC; --bad:#B3261E; --bad-soft:#FBE4E2; --violet:#5A4C9C;
  --side-bg:#1B2537; --side-ink:#FFFFFF; --side-muted:#9AA6B8; --side-hover:rgba(255,255,255,.07); --side-active:#2D5394; --side-line:#2C3749;
  --card-shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  --shadow:0 12px 34px rgba(16,24,40,.18); --backdrop:rgba(12,18,30,.45);
  --f-display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c1:#5E8DD8; --c2:#B08A35;
  --bg:#0E141E; --surface:#161F2C; --surface-2:#1C2736; --ink:#E6EBF2; --muted:#98A3B3; --line:#273345;
  --accent:#7AA3E6; --accent-ink:#0B1626; --accent-soft:#1B2D48;
  --mark:#D5B060; --mark-soft:#33290F; --mark-ink:#E6CB8E;
  --good:#6CC183; --good-soft:#14301C; --warn:#E9A55B; --warn-soft:#38250F; --bad:#F08A80; --bad-soft:#3B1714; --violet:#A99BEA;
  --side-bg:#0A1019; --side-ink:#FFFFFF; --side-muted:#8E9AAC; --side-hover:rgba(255,255,255,.06); --side-active:#2D5394; --side-line:#1E2938;
  --card-shadow:none;
  --shadow:0 12px 34px rgba(0,0,0,.55); --backdrop:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --c1:#5E8DD8; --c2:#B08A35;
  --bg:#0E141E; --surface:#161F2C; --surface-2:#1C2736; --ink:#E6EBF2; --muted:#98A3B3; --line:#273345;
  --accent:#7AA3E6; --accent-ink:#0B1626; --accent-soft:#1B2D48;
  --mark:#D5B060; --mark-soft:#33290F; --mark-ink:#E6CB8E;
  --good:#6CC183; --good-soft:#14301C; --warn:#E9A55B; --warn-soft:#38250F; --bad:#F08A80; --bad-soft:#3B1714; --violet:#A99BEA;
  --side-bg:#0A1019; --side-ink:#FFFFFF; --side-muted:#8E9AAC; --side-hover:rgba(255,255,255,.06); --side-active:#2D5394; --side-line:#1E2938;
  --card-shadow:none;
  --shadow:0 12px 34px rgba(0,0,0,.55); --backdrop:rgba(0,0,0,.6); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.85rem;font-weight:700}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:.98rem;font-weight:650}
p{margin:0}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.topbar .spacer{flex:1}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:.68rem;color:var(--muted);cursor:pointer;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.main{min-width:0;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){
  .app{grid-template-columns:236px 1fr}
  .topbar,.tabbar{display:none}
  body::before{display:none}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:start;height:100dvh;background:var(--side-bg);color:var(--side-ink);padding:22px 10px 16px}
  .side .brand{padding:4px 8px 22px}
  .side .brand-name{color:var(--side-ink);font-size:1.05rem}
  .side .brand-sub{color:var(--side-muted)}
  .side-label{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 6px;font-weight:500}
  .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:7px;border:0;background:none;cursor:pointer;color:#E4E9F1;font-weight:500;font-size:1rem;text-align:left}
  .nav svg{width:19px;height:19px;color:var(--side-muted)}
  .nav:hover{background:var(--side-hover);color:#fff}
  .nav[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
  .nav[aria-current="page"] svg{color:#fff}
  .nav:focus-visible{outline-color:#fff}
  .side .grow{flex:1}
  .nav-badge{background:#C8372D;color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 7px;display:inline-grid;place-items:center;font-size:.78rem;font-weight:700}
  .side .side-foot{border-top:1px solid var(--side-line);padding-top:10px;margin-top:6px}
  .main{padding-block:28px 48px;padding-left:32px;padding-right:32px}
}
.logo{width:34px;height:34px;flex:none}

/* page parts */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between}
.page-head .actions{display:flex;flex-wrap:wrap;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--card-shadow)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stats .stat.wide{grid-column:1 / -1}
@media(min-width:1180px){.stats{grid-template-columns:repeat(5,1fr)}.stats .stat.wide{grid-column:auto}}
.stat.quote{color:var(--ink);--dot:var(--mark)}
.stat.quote:hover{border-color:var(--mark)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--card-shadow);--dot:var(--accent)}
.stat .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat .k{font-size:.76rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:500;display:flex;align-items:center;gap:8px}
.stat .k::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--dot);flex:none}
.stat .d{font-size:.8rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 9px;font-size:.8rem}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:1.2rem;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:650;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.lead{background:var(--mark-soft);color:var(--mark-ink);border-color:transparent}
.pill.quoted,.pill.scheduled,.pill.sent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.active,.pill.completed,.pill.paid{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.in-progress,.pill.partial{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.overdue,.pill.past-due{background:var(--bad-soft);color:var(--bad);border-color:transparent}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:.74rem;opacity:.8;margin-left:4px}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 4px;border-top:1px solid var(--line);align-items:center;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.list > .row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:650;min-width:0;overflow-wrap:anywhere}
.row .s{grid-column:1;font-size:.84rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.row .r{grid-row:1 / span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.jobrow{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.list > .jobrow:first-child{border-top:0}
.jobrow .time{font-family:var(--f-mono);font-size:.86rem;font-weight:500;padding-top:2px}
.jobrow .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.jobrow .line1{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.jobrow .name{font-weight:680;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-size:1rem}
.jobrow .name:hover{color:var(--accent)}
.jobrow .addr{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.datehead{display:flex;align-items:baseline;gap:10px;padding:14px 4px 4px;border-top:1px solid var(--line)}
.datehead:first-child{border-top:0;padding-top:2px}
.datehead .dname{font-family:var(--f-display);font-weight:650}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--muted)}
.empty strong{color:var(--ink)}
.notice{border-radius:var(--r);padding:12px 14px;background:var(--mark-soft);color:var(--mark-ink);font-size:.88rem;display:flex;gap:10px;align-items:flex-start}
.notice.info{background:var(--accent-soft);color:var(--ink)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

mark{background:var(--mark-soft);color:inherit;border-radius:2px;box-shadow:0 0 0 1px var(--mark-soft)}
.cpick{position:relative}
.cpick-box{position:relative}
.cpick-box .cpick-q{padding-right:40px}
.cpick-clear{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:32px;height:32px}
.cpick-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:min(320px,50vh);overflow-y:auto}
.cpick-opt{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 12px;cursor:pointer;color:var(--ink)}
.cpick-opt:first-child{border-top:0}
.cpick-opt .n{font-weight:620}
.cpick-opt .a{font-size:.8rem;color:var(--muted);font-weight:400}
.cpick-opt[aria-selected="true"],.cpick-opt:hover{background:var(--accent-soft)}
.cpick-none{padding:12px;color:var(--muted);font-size:.88rem}
.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* reports */
.rep-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media(min-width:900px){.rep-layout{grid-template-columns:250px minmax(0,1fr)}}
.rep-menu{padding:8px}
.rep-pick{display:block}
.rep-list{display:none;flex-direction:column;gap:2px}
@media(min-width:900px){.rep-pick{display:none}.rep-list{display:flex}}
.rep-item{display:flex;flex-direction:column;gap:1px;text-align:left;border:0;background:none;border-radius:7px;padding:9px 10px;cursor:pointer;color:var(--ink)}
.rep-item .rt{font-weight:600;font-size:.92rem}
.rep-item .rd{font-size:.76rem;color:var(--muted)}
.rep-item:hover{background:var(--surface-2)}
.rep-item[aria-current="page"]{background:var(--accent-soft)}
.rep-item[aria-current="page"] .rt{color:var(--accent)}
@media(min-width:1180px){.rep-kpis{grid-template-columns:repeat(4,1fr)}}
.rep-table tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}
.linkish:hover{text-decoration:underline}
.sbar{display:inline-block;width:80px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;vertical-align:middle;margin-right:6px;border:1px solid var(--line)}
.sbar span{display:block;height:100%;background:var(--c1);border-radius:99px}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-bottom:8px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart-scroll{overflow-x:auto}
.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--muted);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .hit{cursor:crosshair}
.chart .hit:hover{fill:var(--ink);fill-opacity:.04}
.chart-tip{position:fixed;z-index:90;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:.82rem;display:flex;flex-direction:column;gap:2px;pointer-events:none;font-variant-numeric:tabular-nums}
/* calendar */
.cal-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.cal-nav{display:flex;align-items:center;gap:4px;min-width:0}
.cal-nav .icon-btn{font-size:1.5rem;border:1px solid var(--line);background:var(--surface)}
.cal-title{font-size:1.25rem;margin-left:8px}
.cal-sum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.86rem;color:var(--muted);align-items:center}
.cal-sum strong{color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:inline-flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-left:auto;font-size:.76rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:-6px;background:var(--accent)}
.legend i.in-progress{background:var(--warn)} .legend i.completed{background:var(--good)} .legend i.past-due{background:var(--bad)} .legend i.quoted{background:transparent;border:1.5px dashed var(--mark)}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media(min-width:1180px){.cal-wrap{grid-template-columns:minmax(0,1fr) 270px}}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--card-shadow)}
.cal-dow{background:var(--surface-2);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px;font-weight:600}
.ccell{background:var(--surface);min-height:122px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.ccell.out{background:var(--surface-2)} .ccell.out .cnum{color:var(--muted);font-weight:500}
.ccell.past:not(.today) .cnum{color:var(--muted)}
.ccell.today .cnum{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px}
.ccell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ccell.over,.wcol.over{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.chead{display:flex;align-items:center;gap:4px;min-height:22px}
.cnum{font-weight:650;font-size:.86rem;font-variant-numeric:tabular-nums;line-height:22px}
.cload{margin-left:auto;font-size:.68rem;color:var(--muted);font-family:var(--f-mono)}
.cadd{margin-left:auto;border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:5px;cursor:pointer;opacity:0;font-size:1.05rem;line-height:1;flex:none}
.cload + .cadd{margin-left:0}
.ccell:hover .cadd,.cadd:focus-visible{opacity:1}
.cadd:hover{background:var(--accent-soft);color:var(--accent)}
.cchips,.wlist{display:flex;flex-direction:column;gap:3px;min-width:0}
.cchip{display:flex;gap:5px;align-items:baseline;width:100%;min-width:0;border:0;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:3px 6px;font-size:.76rem;text-align:left;cursor:pointer;overflow:hidden;white-space:nowrap}
.cchip:hover{filter:brightness(.97)}
.cchip .ct{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);flex:none}
.cchip .cn{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cchip .cm{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cchip.completed{border-left-color:var(--good);background:var(--good-soft)}
.cchip.in-progress{border-left-color:var(--warn);background:var(--warn-soft)}
.cchip.past-due{border-left-color:var(--bad);background:var(--bad-soft)}
.cchip.quoted{background:var(--surface);outline:1.5px dashed var(--mark);outline-offset:-1.5px;border-left-color:var(--mark)}
.cchip[draggable="true"]{cursor:grab}
.dragging{opacity:.45}
.cmore{border:0;background:none;color:var(--accent);font-size:.74rem;font-weight:600;text-align:left;padding:1px 4px;cursor:pointer}
.cdots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}
.cdots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}

function repPeriod(){
  const t=todayISO(), d=parseISO(t), y=d.getFullYear(), m=d.getMonth();
  switch(S.rep.period){
    case 'month': return {from:iso(new Date(y,m,1)), to:iso(new Date(y,m+1,0))};
    case 'lastmonth': return {from:iso(new Date(y,m-1,1)), to:iso(new Date(y,m,0))};
    case 'quarter': { const q=Math.floor(m/3)*3; return {from:iso(new Date(y,q,1)), to:iso(new Date(y,q+3,0))}; }
    case 'lastyear': return {from:`${y-1}-01-01`, to:`${y-1}-12-31`};
    case '12m': return {from:iso(new Date(y,m-11,1)), to:iso(new Date(y,m+1,0))};
    case 'custom': { const f=S.rep.from||iso(new Date(y,m,1)), to=S.rep.to||t; return f<=to?{from:f,to}:{from:to,to:f}; }
    default: return {from:`${y}-01-01`, to:t};

}

function monthsBetween(from,to){ const out=[]; const a=parseISO(from); const end=parseISO(to); let d=new Date(a.getFullYear(),a.getMonth(),1); while(d<=end){ out.push(iso(d).slice(0,7)); d=new Date(d.getFullYear(),d.getMonth()+1,1); } return out; }
const monthLabel = ym => { const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'short',year:'2-digit'}); };

function allPayments(){ const out=[]; liveInvoices().forEach(v=>(v.payments||[]).forEach(p=>out.push({...p, inv:v}))); return out; }
function shareBar(v,max){ const w=max?Math.max(2,Math.round(v/max*100)):0; return `<span class="sbar" aria-hidden="true"><span style="width:${w}%"></span></span>`; }
function groupedBars(labels, series){
  const W=Math.max(360, labels.length*70+70), H=230, L=58, R=12, T=14, B=30, iw=W-L-R, ih=H-T-B;
  const raw=Math.max(1,...series.flatMap(x=>x.values)); const mag=Math.pow(10,Math.floor(Math.log10(raw))); const max=Math.ceil(raw/mag/ (raw/mag>5?2:1))*mag*(raw/mag>5?2:1);
  const gw=iw/labels.length, bw=Math.max(6,Math.min(24,(gw-14-2*(series.length-1))/series.length));
  let g='';
  for(let i=0;i<=4;i++){ const y=T+ih-ih*i/4; g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="${i?'grid':'axis'}"/><text x="${L-8}" y="${y+4}" class="tick" text-anchor="end">${shortMoney(max*i/4)}</text>`; }
  labels.forEach((lab,i)=>{
    const gx=L+gw*i, x0=gx+(gw-(bw*series.length+2*(series.length-1)))/2;
    series.forEach((sr,k)=>{ const v=sr.values[i]; if(v<=0) return; const h=Math.max(1,ih*v/max), x=x0+k*(bw+2), y=T+ih-h, r=Math.min(4,h,bw/2);
      g+=`<path d="M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${y+h}Z" style="fill:var(${sr.color})"/>`; });
    g+=`<text x="${gx+gw/2}" y="${H-10}" class="tick" text-anchor="middle">${esc(lab)}</text>`;
    g+=`<rect class="hit" x="${gx}" y="${T}" width="${gw}" height="${ih}" fill="transparent" data-tip="${esc(lab+'|'+series.map(sr=>sr.name+': '+money(sr.values[i])).join('|'))}"/>`;
  });
  return `<div class="chart-legend">${series.map(sr=>`<span><i style="background:var(${sr.color})"></i>${esc(sr.name)}</span>`).join('')}</div>
    <div class="chart-scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W,560)}px" role="img" aria-label="${esc(series.map(x=>x.name).join(' and '))} by month">${g}</svg></div>`;
}

/* ---------- calendar ---------- */
function calRange(){
  const a=parseISO(S.cal.anchor);
  if(S.cal.mode==='week'){ const st=new Date(a); st.setDate(a.getDate()-a.getDay()); return {start:iso(st), days:7}; }
  const first=new Date(a.getFullYear(),a.getMonth(),1), last=new Date(a.getFullYear(),a.getMonth()+1,0);
  const st=new Date(first); st.setDate(1-first.getDay());
  return {start:iso(st), days:Math.ceil((first.getDay()+last.getDate())/7)*7};
}
function jobState(j){ return (j.status==='Scheduled' && j.date<todayISO()) ? 'Past due' : j.status; }
function calChip(j, wide){
  const c=cust(j.customerId); const st=jobState(j); const drag=['Scheduled','Quoted','In progress'].includes(j.status);
  const nm = c ? (wide ? custLabel(c) : (nameParts(c).last || custLabel(c))) : 'Deleted';
  const tip = `${custLabel(c)} · ${st}${j.time?' · '+fmtTime(j.time):''} · ${money(itemsTotal(j.items))}${j.hours?' · '+j.hours+'h':''}`;
  return `<button class="cchip ${slug(st)}" data-act="openJob" data-id="${j.id}" ${drag?`draggable="true" data-drag="job:${j.id}"`:''} title="${esc(tip)}">
    <span class="ct">${j.status==='Quoted'?'Quote':(j.time?esc(fmtTime(j.time)):'')}</span><span class="cn">${esc(nm)}</span>
    ${wide?`<span class="cm">${esc(c&&c.city?c.city+' · ':'')}${money(itemsTotal(j.items))}${j.hours?` · ${esc(j.hours)}h`:''}${j.crew?` · ${esc(j.crew)}`:''}</span>`:''}</button>`;
}
function dayStats(list){
  const booked=list.filter(j=>j.status!=='Quoted');
  const hours=booked.reduce((s,j)=>s+(+j.hours||0),0);
  return {n:booked.length, q:list.length-booked.length, val:booked.reduce((s,j)=>s+itemsTotal(j.items),0), hours};
}
function loadBar(st){
  const cap=+settings().dayCapacity||0; if(!cap || !st.hours) return '';
  const pct=st.hours/cap*100; const cls=pct>100?'over':pct>=85?'full':'';
  return `<div class="loadbar ${cls}" title="${st.hours} of ${cap} hours booked"><span style="width:${Math.min(100,pct)}%"></span></div>`;
}
function viewCalendar(){
  const C=S.cal; const t=todayISO(); const {start,days}=calRange(); const end=addDays(start,days-1);
  const show=j=>j.status!=='Cancelled' && (C.showQuotes || j.status!=='Quoted');
  const by={}; S.jobs.filter(j=>j.date>=start && j.date<=end && show(j)).forEach(j=>(by[j.date] ||= []).push(j));
  Object.values(by).forEach(a=>a.sort((x,y)=>(x.status==='Quoted')-(y.status==='Quoted') || (x.time||'99').localeCompare(y.time||'99')));
  const a=parseISO(C.anchor);
  const title = C.mode==='month' ? a.toLocaleDateString('en-US',{month:'long',year:'numeric'})
    : `${parseISO(start).toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${parseISO(end).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;
  const all=Object.values(by).flat(); const rs=dayStats(all); const cap=+settings().dayCapacity||0;
  const dates=Array.from({length:days},(_,i)=>addDays(start,i));

    ${dates.map(d=>{ const list=by[d]||[]; const st=dayStats(list); const pd=parseISO(d); const out=pd.getMonth()!==a.getMonth();
      return `<div class="ccell${out?' out':''}${d===t?' today':''}${d===C.sel?' sel':''}${d<t?' past':''}" role="gridcell" data-date="${d}" data-act="calSel" data-d="${d}" aria-label="${esc(fmtDay(d))}: ${st.n} job${st.n===1?'':'s'}">
        <div class="chead"><span class="cnum">${pd.getDate()}</span>${st.n?`<span class="cload">${money(st.val).replace(/\.00$/,'')}</span>`:''}<button class="cadd" data-act="calNew" data-d="${d}" aria-label="New job on ${esc(fmtDay(d))}">+</button></div>
        <div class="cchips">${list.slice(0,3).map(j=>calChip(j,false)).join('')}${list.length>3?`<button class="cmore" data-act="calWeek" data-d="${d}">+${list.length-3} more</button>`:''}</div>
        <div class="cdots" aria-hidden="true">${list.slice(0,5).map(j=>`<i class="${slug(jobState(j))}"></i>`).join('')}</div>
        ${loadBar(st)}</div>`; }).join('')}</div>`;
  } else {
    grid = `<div class="wgrid">${dates.map(d=>{ const list=by[d]||[]; const st=dayStats(list); const pd=parseISO(d);
      return `<div class="wcol${d===t?' today':''}${d<t?' past':''}" data-date="${d}">
        <div class="whead"><span class="dow">${DOW[pd.getDay()]}</span><span class="dn">${pd.getDate()}</span><span class="ds">${st.n?`${st.n} job${st.n===1?'':'s'} · ${money(st.val).replace(/\.00$/,'')}`:'Open'}${st.hours&&cap?` · ${st.hours}/${cap}h`:''}</span></div>
        ${loadBar(st)}
        <div class="wlist">${list.map(j=>calChip(j,true)).join('')}</div>
        <button class="btn ghost sm wadd" data-act="calNew" data-d="${d}">${I.plus} Job</button></div>`; }).join('')}</div>`;
  }
  // selected day (phones, month view)
  let daylist='';
  if(C.mode==='month'){
    const sd = C.sel || (t>=start && t<=end ? t : null);
    if(sd){ const list=(by[sd]||[]); daylist = `<section class="panel cal-daylist"><div class="panel-head"><h2>${esc(fmtDay(sd))}</h2><span class="btnrow"><button class="btn sm" data-act="calNew" data-d="${sd}" data-quote="1">${I.plus} Quote</button><button class="btn sm primary" data-act="calNew" data-d="${sd}">${I.plus} Job</button></span></div>
      ${list.length?`<div class="list">${list.map(j=>jobRow(j)).join('')}</div>`:'<p class="muted">Nothing booked. Tap + Job to schedule this day.</p>'}</section>`; }
  }
  // to-book list
  const horizon=addDays(t,45);
  const due=S.customers.filter(c=>c.status==='Active').map(c=>({c,due:nextDue(c)})).filter(x=>x.due && x.due<=horizon && !nextJob(x.c.id)).sort((x,y)=>x.due.localeCompare(y.due));
  const quotes=S.jobs.filter(j=>j.status==='Quoted').sort((x,y)=>(x.createdAt||0)-(y.createdAt||0));
  const tip = 'ontouchstart' in window ? 'Pick a day on the calendar, then tap Book.' : 'Drag onto a day, or pick a day and tap Book.';
  const tobook = `<aside class="panel tobook" aria-label="To book"><div class="panel-head"><h2>To book</h2><span class="muted" style="font-size:.8rem">${due.length+quotes.length}</span></div>
    <p class="hint" style="margin-bottom:10px">${tip}${C.sel?` Booking for <strong>${esc(fmtDate(C.sel))}</strong>.`:''}</p>
    ${quotes.length?`<div class="lbl" style="margin:4px 0 6px">Open quotes</div>${quotes.map(j=>`<div class="bk" draggable="true" data-drag="quote:${j.id}"><div class="bk-t"><button class="bk-n" data-act="openJob" data-id="${j.id}">${esc(custName(j.customerId))}</button><span>${money(itemsTotal(j.items))}${j.date?` · proposed ${esc(fmtDate(j.date))}`:''}</span></div><button class="btn sm" data-act="calBookQuote" data-id="${j.id}">Book</button></div>`).join('')}`:''}
    ${due.length?`<div class="lbl" style="margin:12px 0 6px">Due for service</div>${due.map(({c,due})=>`<div class="bk" draggable="true" data-drag="cust:${c.id}"><div class="bk-t"><button class="bk-n" data-act="openCustomer" data-id="${c.id}">${esc(custLabel(c))}</button><span>${due<t?'<span style="color:var(--bad)">Overdue</span>':'Due '+esc(fmtDate(due))} · ${esc(FREQ[c.frequency][0])}</span></div><button class="btn sm" data-act="calBookCust" data-id="${c.id}">Book</button></div>`).join('')}`:''}
    ${!due.length&&!quotes.length?'<p class="muted" style="font-size:.88rem">Nothing waiting. Open quotes and recurring customers coming due in the next 6 weeks show up here.</p>':''}
  </aside>`;
  return `
  <div class="page-head"><div><p class="eyebrow">Schedule</p><h1>Calendar</h1></div><div class="actions"><button class="btn" data-act="calNew" data-d="${C.sel||t}" data-quote="1">${I.plus} Quote</button><button class="btn primary" data-act="calNew" data-d="${C.sel||t}">${I.plus} Job</button></div></div>
  <div class="cal-bar">
    <div class="cal-nav"><button class="icon-btn" data-act="calNav" data-dir="-1" aria-label="Previous ${C.mode}">‹</button><button class="btn sm" data-act="calToday">Today</button><button class="icon-btn" data-act="calNav" data-dir="1" aria-label="Next ${C.mode}">›</button><h2 class="cal-title">${esc(title)}</h2></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label style="display:flex;gap:6px;align-items:center;font-size:.86rem;font-weight:600;color:var(--muted)"><input type="checkbox" id="cal-q" ${C.showQuotes?'checked':''}> Show quotes</label>
      <div class="seg" role="radiogroup" aria-label="Calendar view">${[['month','Month'],['week','Week']].map(([k,l])=>`<button class="seg-btn" role="radio" aria-checked="${C.mode===k}" data-act="calMode" data-m="${k}">${l}</button>`).join('')}</div>
    </div>
  </div>
  <div class="cal-sum"><span><strong>${rs.n}</strong> job${rs.n===1?'':'s'} booked</span><span><strong>${money(rs.val)}</strong> scheduled</span>${rs.hours?`<span><strong>${rs.hours}</strong> est. hours</span>`:''}${rs.q&&C.showQuotes?`<span><strong>${rs.q}</strong> quote${rs.q===1?'':'s'} pencilled in</span>`:''}
    <span class="legend"><i class="scheduled"></i>Scheduled <i class="in-progress"></i>In progress <i class="completed"></i>Done <i class="past-due"></i>Past due <i class="quoted"></i>Quote</span></div>
  <div class="cal-wrap"><div style="min-width:0;display:flex;flex-direction:column;gap:14px">${grid}${daylist}</div>${tobook}</div>`;
}

/* ---------- two-way texting ---------- */
const d10 = p => String(p||'').replace(/\D/g,'').slice(-10);
let _phoneIdx={src:null, map:new Map()};
function custByPhone(num){
  if(_phoneIdx.src!==S.customers){ const m=new Map(); S.customers.forEach(c=>{ const k=d10(c.phone); if(k.length===10 && !m.has(k)) m.set(k,c); }); _phoneIdx={src:S.customers, map:m}; }
  return _phoneIdx.map.get(d10(num)) || null;
}
const fmtNum = n => { const x=d10(n); return x.length===10?`(${x.slice(0,3)}) ${x.slice(3,6)}-${x.slice(6)}`:String(n||'Unknown number'); };
function msgCustomerId(m){ if(m.customerId) return m.customerId; const c=m.number?custByPhone(m.number):null; return c?c.id:''; }
function conversations(){
  const map=new Map();
  S.messages.forEach(m=>{
    if(m.channel==='email') return;
    const cid=msgCustomerId(m); const num=d10(m.number||m.to||m.from);
    const k = cid ? 'c:'+cid : (num ? 'n:'+num : null); if(!k) return;
    let g=map.get(k); if(!g){ g={key:k, cid, number: cid ? d10(cust(cid)?.phone)||num : num, msgs:[], unread:0}; map.set(k,g); }
    g.msgs.push(m); if(m.direction==='in' && !m.read) g.unread++;
  });
  return [...map.values()].map(g=>{ g.msgs.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); g.last=g.msgs[g.msgs.length-1]; return g; }).sort((a,b)=>(b.last.createdAt||0)-(a.last.createdAt||0));
}
const unreadTexts = () => S.messages.reduce((n,m)=>n+(m.channel!=='email' && m.direction==='in' && !m.read ? 1 : 0),0);
function convName(g){ return g.cid ? custLabel(cust(g.cid)) : fmtNum(g.number); }
function threadHtml(g){
  if(!g || !g.msgs.length) return '<p class="muted">No texts yet. Send the first one below.</p>';
  let lastDay='';
  return `<div class="thread">${g.msgs.map(m=>{ const dir=m.direction==='in'?'in':'out'; const day=m.createdAt?new Date(m.createdAt).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):''; const sep=day&&day!==lastDay?`<div class="tday">${esc(day)}</div>`:''; lastDay=day||lastDay;
    return `${sep}<div class="tmsg ${dir}"><div class="bubble ${dir}">${esc(m.body)}</div><span class="tmeta">${m.createdAt?esc(new Date(m.createdAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})):''}${dir==='out'&&m.viaPhoneCom?' · from phone.com app':''}${dir==='out'&&!m.sent&&!m.viaPhoneCom&&!m.pcPending&&!m.pcId?' · logged':''}</span></div>`; }).join('')}</div>`;
}
async function sendSms(number, body, extra={}){
  const r=await callFn('messaging',{action:'sms', to:number, text:body});
  if(!r.ok){ toast(r.error,'bad'); return false; }
  const cid = extra.customerId || (custByPhone(number)?.id || '');
  await write(()=>saveDoc('messages',newId('messages'),{customerId:cid, to:fmtNum(number), number:d10(number), toDigits:d10(number), body, channel:'phone.com', direction:'out', sent:true, pcPending:true, read:true, jobId:extra.jobId||'', invoiceId:extra.invoiceId||'', createdAt:Date.now(), by:S.uid||''}),'Text sent');
  return true;
}
async function markThreadRead(key){
  const g=conversations().find(x=>x.key===key); if(!g) return;
  for(const m of g.msgs.filter(m=>m.direction==='in' && !m.read)){ try{ await saveDoc('messages', m.id, {...m, read:true}); }catch(e){} }
}

/* ---------- fleet ---------- */
const VEH_STATUS=['Active','In the shop','Out of service','Sold'];
const DEFAULT_SCHEDULE=[{name:'Oil & filter change', miles:5000, months:6},{name:'Tire rotation', miles:7500, months:12},{name:'Brake inspection', miles:15000, months:12},{name:'Air filter', miles:15000, months:12}];
const LOG_TYPES_EXTRA=['Mileage update','Repair','Tires','State inspection','Registration renewal','Insurance renewal','Cleaning / ladder rack','Other'];
const veh = id => S.vehicles.find(v=>v.id===id);
const vehName = v => v ? (v.name || [v.year,v.make,v.model].filter(Boolean).join(' ') || 'Vehicle') : 'Removed vehicle';
const vehDesc = v => [v.year,v.make,v.model].filter(Boolean).join(' ');
const vLogs = id => S.vehicle_logs.filter(l=>l.vehicleId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (+b.odometer||0)-(+a.odometer||0) || (b.createdAt||0)-(a.createdAt||0));
const fmtMi = n => (n==null||n==='') ? '—' : Math.round(+n).toLocaleString('en-US')+' mi';
function vOdo(v){ return Math.max(+v.odometer||0, ...vLogs(v.id).map(l=>+l.odometer||0), 0) || null; }
function schedule(v){ return (v.schedule && v.schedule.length) ? v.schedule : DEFAULT_SCHEDULE; }
function schedStatus(v){
  const odo=vOdo(v); const t=todayISO(); const logs=vLogs(v.id);
  return schedule(v).map(it=>{
    const last=logs.find(l=>(l.type||'').toLowerCase()===it.name.toLowerCase());
    if(!last) return {...it, last:null, state:'unknown', label:'No record yet'};
    const nextMi = (it.miles && last.odometer) ? (+last.odometer + +it.miles) : null;
    const nextDate = it.months ? addMonths(last.date, +it.months) : null;
    const miLeft = (nextMi!=null && odo!=null) ? nextMi-odo : null;
    const daysLeft = nextDate ? Math.round((parseISO(nextDate)-parseISO(t))/864e5) : null;
    let state='ok';
    if((miLeft!=null && miLeft<0) || (daysLeft!=null && daysLeft<0)) state='overdue';
    else if((miLeft!=null && miLeft<=500) || (daysLeft!=null && daysLeft<=30)) state='soon';
    const parts=[]; if(nextMi!=null) parts.push(miLeft!=null&&miLeft<0?`${fmtMi(-miLeft)} over`:`at ${fmtMi(nextMi)}`); if(nextDate) parts.push(daysLeft<0?`${-daysLeft} days late`:`by ${fmtDate(nextDate)}`);
    return {...it, last, nextMi, nextDate, miLeft, daysLeft, state, label:parts.join(' or ')};
  });
}
const DOC_SLOTS=[['registration','Registration','regExp'],['insurance','Insurance card','insExp']];
function docDates(v){
  const t=todayISO(); const out=[];
  [['Registration',v.regExp],['Insurance',v.insExp],['State inspection',v.inspExp]].forEach(([l,d])=>{ if(!d) return; const days=Math.round((parseISO(d)-parseISO(t))/864e5); out.push({label:l, date:d, days, state: days<0?'overdue':days<=30?'soon':'ok'}); });
  return out;
}
function vehAlerts(v){
  if(v.status==='Sold' || v.status==='Out of service') return [];
  const a=[];
  schedStatus(v).forEach(it=>{ if(it.state==='overdue') a.push({sev:2, text:`${it.name} overdue (${it.label})`}); else if(it.state==='soon') a.push({sev:1, text:`${it.name} due soon (${it.label})`}); });
  docDates(v).forEach(d=>{ if(d.state==='overdue') a.push({sev:2, text:`${d.label} expired ${fmtDate(d.date)}`}); else if(d.state==='soon') a.push({sev:1, text:`${d.label} expires ${fmtDate(d.date)}`}); });
  if(!(v.docs&&v.docs.insurance)) a.push({sev:1, text:'No insurance card uploaded'});
  if(!(v.docs&&v.docs.registration)) a.push({sev:1, text:'No registration uploaded'});
  return a.sort((x,y)=>y.sev-x.sev);
}
function fleetAttention(){ return S.vehicles.filter(v=>vehAlerts(v).some(a=>a.sev>=1 && !/^No (insurance|registration)/.test(a.text) || a.sev===2)); }
function fleetNotice(){
  const list=fleetAttention(); if(!list.length) return '';
  return `<div class="notice" style="align-items:center;flex-wrap:wrap">${I.fleet.replace('<svg','<svg style="width:20px;height:20px;flex:none"')}<span><strong>Fleet:</strong> ${list.map(v=>`${esc(vehName(v))} (${esc(vehAlerts(v)[0].text.toLowerCase())})`).slice(0,3).join('; ')}${list.length>3?` and ${list.length-3} more`:''}.</span><button class="btn sm" data-act="nav" data-view="fleet" style="margin-left:auto">Open fleet</button></div>`;

/* fleet files: private storage, short-lived links */
const FL={url:new Map(), want:new Set(), timer:null};
function fleetUrl(path){ if(!path) return ''; const u=FL.url.get(path); if(u) return u; FL.want.add(path); if(!FL.timer) FL.timer=setTimeout(fetchFleetUrls,40); return ''; }
async function fetchFleetUrls(){
  FL.timer=null; const paths=[...FL.want].filter(p=>!FL.url.has(p)); FL.want.clear(); if(!paths.length||!sb) return;
  const {data}=await sb.storage.from('fleet').createSignedUrls(paths, 60*60*6);
  paths.forEach(p=>FL.url.set(p, '#')); (data||[]).forEach(x=>{ if(x.signedUrl && x.path) FL.url.set(x.path, x.signedUrl); });
  scheduleRender();
}

function vehCard(v){

    <div class="veh-stats"><span><span class="lbl">Odometer</span>${esc(fmtMi(vOdo(v)))}</span><span><span class="lbl">Driver</span>${esc(v.driver||'—')}</span><span><span class="lbl">Next service</span>${nx?esc(`${nx.name}, ${nx.label}`):'Log a service to start tracking'}</span></div>
    <div class="doc-chips">${DOC_SLOTS.map(docChip).join('')}</div>
    ${al.length?`<div class="veh-alerts">${al.slice(0,3).map(a=>`<span class="${a.sev===2?'bad':'soon'}">${a.sev===2?'●':'○'} ${esc(a.text)}</span>`).join('')}</div>`:''}
  </button>`;
}

async function putFleetFile(file, vid){
  if(!file) return null;
  const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name||'');
  if(!isPdf && !/^image\//.test(file.type||'') && !/\.(jpe?g|png|heic|heif|webp|gif)$/i.test(file.name||'')) throw {code:'unsupported_type'};
  let blob=file, type=isPdf?'application/pdf':(file.type||'image/jpeg');
  if(!isPdf){ try{ blob=await shrinkDoc(file); type='image/jpeg'; }catch(e){ blob=file; } }
  if(blob.size>15*1024*1024) throw {code:'too_large'};
  const path=`${vid}/${genId()}${isPdf?'.pdf':'.jpg'}`;
  const {error}=await sb.storage.from('fleet').upload(path, blob, {contentType:type, upsert:false});
  if(error) throw {code:/size|large/i.test(error.message)?'too_large':/mime|type/i.test(error.message)?'unsupported_type':'unavailable', message:error.message};
  return {path, type, name:file.name||'', at:Date.now(), by:S.uid||''};
}
async function shrinkDoc(file){
  const bmp=await createImageBitmap(file); const max=2400; const k=Math.min(1, max/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.88));
}

}

function openDrawer(kind, args={}, refresh){
  const fn = DRAWERS[kind]; if(!fn) return;
  const out = fn(args); if(!out){ closeDrawer(); return; }
  const isDetail = !!out.detail;
  const root=$('#drawer-root');
  const scroll = refresh && root.querySelector('.drawer') ? root.querySelector('.drawer').scrollTop : 0;
  // Preserve range slider positions on refresh
  const ranges = refresh ? [...root.querySelectorAll('input[type=range][id]')].map(r=>[r.id,r.value]) : [];
  const typed = refresh ? [...root.querySelectorAll('textarea[id],input[type=text][id],select[id]')].map(e=>[e.id,e.value]) : [];
  const keepScrolled = refresh && drawerState && drawerState._scrolled;
  drawerState = {kind, args, detail:isDetail};
  root.innerHTML = `<div class="drawer-wrap" data-act="backdrop"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <div class="dhead">${out.back?`<button class="icon-btn" data-act="back" aria-label="Back">‹</button>`:''}<h2 id="dtitle">${out.title}</h2><button class="icon-btn" data-act="close" aria-label="Close">×</button></div>
    <div class="dbody">${out.body}</div></div></div>`;
  ranges.forEach(([id,v])=>{ const r=document.getElementById(id); if(r){ r.value=v; updateCmp(r); } });
  typed.forEach(([id,v])=>{ const e=document.getElementById(id); if(e && v) e.value=v; });
  if(keepScrolled) drawerState._scrolled=true;
  if(refresh) root.querySelector('.drawer').scrollTop=scroll;
  else { const f=root.querySelector('input:not([type=hidden]):not([type=file]),select,textarea'); if(f && !isDetail && window.matchMedia('(min-width:900px)').matches) f.focus(); }
  if(out.after) out.after();
}

/* ---------- customer search (shared by every search box and picker) ---------- */
function splitName(n){
  n=String(n||'').trim().replace(/\s+/g,' '); if(!n) return {first:'',last:''};
  const m=n.match(/^([^,]+),\s*(.+)$/); if(m) return {first:m[2].trim(), last:m[1].trim()};
  const parts=n.split(' '); if(parts.length===1) return {first:parts[0], last:''};
  let last=parts.pop(); if(/^(jr\.?|sr\.?|ii|iii|iv)$/i.test(last) && parts.length>1) last=parts.pop()+' '+last;
  return {first:parts.join(' '), last};
}
function nameParts(c){ if(!c) return {first:'',last:''}; if(c.firstName||c.lastName) return {first:c.firstName||'', last:c.lastName||''}; return splitName(c.name); }
function personName(c){ const {first,last}=nameParts(c); return last ? (first?`${last}, ${first}`:last) : first; }
function fullName(c){ const {first,last}=nameParts(c); return [first,last].filter(Boolean).join(' '); }
const custLabel = c => c ? (personName(c) || c.company || 'Unnamed') : '';
function custHay(c){ return [custLabel(c), fullName(c), c.company, c.email, fullAddress(c), (c.tags||[]).join(' ')].join(' ').toLowerCase(); }
function custMatch(c, q){
  const toks = String(q||'').toLowerCase().split(/\s+/).filter(Boolean); if(!toks.length) return true;
  const hay = custHay(c); const digits = String(c.phone||'').replace(/\D/g,'');
  return toks.every(t => hay.includes(t) || (/^[\d()\-.+]+$/.test(t) && t.replace(/\D/g,'') && digits.includes(t.replace(/\D/g,''))));
}
function custRank(c, q){
  const t = String(q||'').toLowerCase().trim().split(/\s+/)[0] || ''; const n = custLabel(c).toLowerCase();
  if(!t) return 3; if(n.startsWith(t)) return 0; if(n.split(/[\s,.-]+/).some(w=>w.startsWith(t))) return 1; if(n.includes(t)) return 2; return 3;
}
function searchCustomers(q, list=S.customers){
  return list.filter(c=>custMatch(c,q)).sort((a,b)=>custRank(a,q)-custRank(b,q) || custLabel(a).localeCompare(custLabel(b)));
}
function hl(text, q){
  const s=String(text||''); const low=s.toLowerCase(); const toks=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  const marks=new Array(s.length).fill(false);
  toks.forEach(t=>{ let i=low.indexOf(t); while(i>=0){ for(let k=i;k<i+t.length;k++) marks[k]=true; i=low.indexOf(t,i+t.length); } });
  let out='', on=false;
  for(let i=0;i<s.length;i++){ if(marks[i]&&!on){ out+='<mark>'; on=true; } if(!marks[i]&&on){ out+='</mark>'; on=false; } out+=esc(s[i]); }
  return out + (on?'</mark>':'');
}

function cpickEls(id){ return {inp:document.getElementById(id+'-q'), hid:document.getElementById(id), list:document.getElementById(id+'-list')}; }
function cpickRender(inp){
  const id=inp.dataset.for; const {hid, list}=cpickEls(id);
  const selLabel = hid.value ? custLabel(cust(hid.value)) : '';
  const q = inp.value.trim()===selLabel ? '' : inp.value.trim();
  const res = searchCustomers(q).slice(0,40);
  inp.dataset.active = res.length ? '0' : '-1';
  list.innerHTML = res.length ? res.map((c,i)=>`<button type="button" class="cpick-opt" role="option" id="${id}-opt-${i}" data-id="${c.id}" aria-selected="${i===0}"><span class="n">${hl(custLabel(c),q)}${c.company&&personName(c)?` <span class="a">· ${hl(c.company,q)}</span>`:''}</span><span class="a">${hl(fullAddress(c)||'No address',q)}${c.phone?' · '+hl(c.phone,q):''}</span></button>`).join('')
    : `<div class="cpick-none">No customer matches “${esc(q)}”.</div>`;
  list.hidden=false; inp.setAttribute('aria-expanded','true');
  if(res.length) inp.setAttribute('aria-activedescendant', id+'-opt-0'); else inp.removeAttribute('aria-activedescendant');
}

function cpickChoose(id, cid){

function cpickMove(inp, dir){
  const id=inp.dataset.for; const {list}=cpickEls(id); const opts=[...list.querySelectorAll('.cpick-opt')]; if(!opts.length) return;

}
function cpickSettle(id){

function linesTable(items){
  if(!(items||[]).length) return '<p class="muted">No services listed.</p>';
  return `<div class="tablewrap"><table class="lines"><thead><tr><th>Service</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.desc)}</td><td class="n">${esc(i.qty)}</td><td class="n">${money(i.rate)}</td><td class="n">${money((+i.qty||0)*(+i.rate||0))}</td></tr>`).join('')}</tbody></table></div>`;
}
function updateCmp(r){
  const box=document.getElementById(r.dataset.cmp); if(!box) return; const v=r.value;
  const clip=box.querySelector('.before-clip'); clip.style.width=v+'%';
  const img=clip.querySelector('img'); img.style.width=box.clientWidth+'px';
  box.querySelector('.divider').style.left=v+'%';
}
function servicesText(items){
  const it=(items||[]).filter(i=>i.desc||i.rate); if(!it.length) return '[services]';
  return it.map(i=>`- ${i.desc}${(+i.qty||0)!==1?` (${i.qty} x ${money(i.rate)})`:''}: ${money((+i.qty||0)*(+i.rate||0))}`).join('\n');
}
function fillTemplate(text, cid, ctx={}){
  const s=settings(); const c=cust(cid);
  const j = ctx.jobId ? job(ctx.jobId) : (c?nextJob(c.id):null);
  let v = ctx.invId ? inv(ctx.invId) : null;
  if(!v && c) v = S.invoices.filter(x=>x.customerId===c.id && totals(x).balance>0 && invStatus(x)!=='Void').sort((a,b)=>(+b.number)-(+a.number))[0];
  const map = {first:firstName(c), name:c?(fullName(c)||c.company):'', business:s.businessName, phone:s.phone,
    date:j?parseISO(j.date).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'[date]', time:j&&j.time?fmtTime(j.time):'[time]',
    amount:v?money(totals(v).balance||totals(v).total):'[amount]', invoice:v?v.number:'[invoice]',
    address:c?(fullAddress(c)||'[address]'):'[address]', email:s.email||'[email]',
    due:v&&v.dueDate?fmtDate(v.dueDate):'[due date]',
    paid:v&&(v.payments||[]).length?money(v.payments[v.payments.length-1].amount):'[payment]',
    total:ctx.invId&&v?money(totals(v).total):(j?money(itemsTotal(j.items)):(v?money(totals(v).total):'[total]')),
    services:servicesText(ctx.invId&&v?v.items:(j?j.items:(v?v.items:[])))};
  return text.replace(/\{(\w+)\}/g,(m,k)=>k in map?map[k]:m);
}

  async doDelete(d){
    if(d.col==='vehicles'){

      const files=[...(v.docs?[v.docs.registration, v.docs.insurance, ...(v.docs.other||[])]:[]), ...logs.map(l=>l.receipt)].filter(f=>f&&f.path).map(f=>f.path);

      const ok=await write(()=>db.collection('vehicles').doc(v.id).delete(),'Vehicle deleted');
      if(ok){ if(files.length) sb.storage.from('fleet').remove(files).catch(()=>{}); closeDrawer(); render(); }
      return;
    }
    if(d.col==='vehicle_logs'){ const l=S.vehicle_logs.find(x=>x.id===d.id); const ok=await write(()=>db.collection('vehicle_logs').doc(d.id).delete(),'Record deleted'); if(ok){ if(l&&l.receipt&&l.receipt.path) sb.storage.from('fleet').remove([l.receipt.path]).catch(()=>{}); back(); } return; }
    if(d.col==='photos'){ const p=S.photos.find(x=>x.id===d.id); const ok=await write(()=>db.collection('photos').doc(d.id).delete(),'Photo deleted'); if(ok&&p&&assets){ try{ await assets.delete(p.assetId); }catch(e){} } if(ok) back(); return; }
    if(d.col==='jobs'){ const j=job(d.id); if(j&&j.invoiceId){ /* keep invoice */ } }
    const ok = await write(()=>db.collection(d.col).doc(d.id).delete(), 'Deleted');
    if(ok) back();
  },
  async exportQB(d){

    if(!list.length){ toast(d.mode==='new'?'No new sent invoices to export.':'No invoices to export.'); return; }
    const mdy = s => { if(!s) return ''; const [y,m,dd]=s.split('-'); return `${m}/${dd}/${y}`; };
    const rows=[['InvoiceNo','Customer','InvoiceDate','DueDate','Terms','Memo','Item(Product/Service)','ItemDescription','ItemQuantity','ItemRate','ItemAmount','Taxable','TaxRate','Service Date']];
    list.forEach(v=>{ const c=cust(v.customerId); const name=c?(c.company&&c.type==='Commercial'?c.company:(fullName(c)||c.company)):'Unknown'; const j=v.jobId?job(v.jobId):null;
      (v.items||[]).forEach(it=>rows.push([v.number,name,mdy(v.date),mdy(v.dueDate),`Net ${settings().termsDays}`,(v.notes||'').replace(/\s+/g,' ').slice(0,200),it.desc,it.desc,it.qty,(+it.rate).toFixed(2),((+it.qty||0)*(+it.rate||0)).toFixed(2),(+v.taxRate)>0?'Y':'N',(+v.taxRate)>0?`${v.taxRate}%`:'',j?mdy(j.date):''])); });
    const ok = await saveFile(`quickbooks-invoices-${todayISO()}.csv`, toCSV(rows));
    if(ok && d.mode==='new'){ for(const v of list){ await write(()=>saveDoc('invoices',v.id,{...v,qbExportedAt:Date.now()})); } toast(`${list.length} invoice${list.length===1?'':'s'} exported`); }

function toCSV(rows){ return rows.map(r=>r.map(x=>{ const s=String(x??''); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(',')).join('\r\n'); }
async function saveFile(filename, data){

async function shrink(file){
  try{
    const bmp = await createImageBitmap(file);
    const max=1800; const k=Math.min(1, max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.84));
  }catch(e){
    if(/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return file;
    throw {code:'unsupported_type'};
  }
}

    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"' && f==='') q=true;

    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=ch;

  const m=s.match(/[,\s]+([A-Za-z]{2})\.?$/);
  if(m && STATE_CODES.has(m[1].toUpperCase())){ state=m[1].toUpperCase(); s=s.slice(0,m.index); }

function dupKeys(c){
  const k=[]; const d=String(c.phone||'').replace(/\D/g,'').slice(-10); if(d.length===10) k.push('p:'+d);

function planImport(){
  const seen=new Set(); S.customers.forEach(c=>dupKeys(c).forEach(k=>seen.add(k)));

async function runImport(){
  if(!db){ toast('Shared data is not connected in this view.','bad'); return; }
  const {recs, dup, empty} = planImport();
  if(!recs.length){ toast('Nothing new to import.','bad'); return; }
  IMP.running={total:recs.length, done:0}; openDrawer('importCust',{});
  let i=0, failed=0, lastErr=null, stop=false;
  const prog=()=>{ const el=$('#imp-prog'); if(el) el.textContent=`${IMP.running.done} of ${IMP.running.total} imported…`; const bar=$('#imp-bar'); if(bar) bar.style.width=(100*IMP.running.done/IMP.running.total)+'%'; };
  async function worker(){
    while(!stop && i<recs.length){
      const c=recs[i++]; let tries=0;
      for(;;){
        try{ await saveDoc('customers', newId('customers'), c); IMP.running.done++; break; }
        catch(e){
          if((e.code==='resource_exhausted'||e.code==='unavailable') && tries<5){ tries++; await new Promise(r=>setTimeout(r, 700*tries+Math.random()*500)); continue; }
          failed++; lastErr=e; if(e.code==='quota_exceeded'||e.code==='invalid_argument') stop=true; break;
        }
      }
      prog();
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  IMP.result={added:IMP.running.done, dup, empty, failed:failed + (stop? recs.length-IMP.running.done-failed : 0), err:lastErr?errMsg(lastErr):null};
  IMP.running=null; openDrawer('importCust',{});
  if(IMP.result.added) toast(`${IMP.result.added} customer${IMP.result.added===1?'':'s'} imported`);
}

const ymd=(y,m,d)=>{ if(!(y>1900&&y<2200&&m>=1&&m<=12&&d>=1&&d<=31)) return ''; const dt=new Date(y,m-1,d); return dt.getMonth()===m-1 ? iso(dt) : ''; };

function parseTimeAny(v){

const numAny = v => { const t=String(v??'').replace(/[^0-9.\-]/g,''); if(t===''||t==='-'||t==='.') return null; const n=parseFloat(t); return isNaN(n)?null:n; };

    if(/quote|estimate|bid|proposal|awaiting approval|pending approval/.test(v)) return 'Quoted';
    if(/progress|started|en route|on site|underway/.test(v)) return 'In progress';
    if(/complete|done|finish|paid|closed|invoiced|billed|archived/.test(v)) return 'Completed';
    if(/sched|book|upcoming|confirm|open|assigned|planned|pending|active/.test(v)) return 'Scheduled';

const normNm = s => String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const normSt = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function buildCustMatcher(){
  const byPhone=new Map(), byEmail=new Map(), byNameSt=new Map(), byName=new Map();
  const add=(m,k,id)=>{ if(!k) return; if(!m.has(k)) m.set(k,[]); if(!m.get(k).includes(id)) m.get(k).push(id); };
  S.customers.forEach(c=>{
    const ph=d10(c.phone); if(ph.length===10) add(byPhone,ph,c.id);
    if(c.email) add(byEmail,c.email.toLowerCase().trim(),c.id);
    [normNm(fullName(c)), normNm(c.company)].filter(Boolean).forEach(n=>{ add(byName,n,c.id); if(c.street) add(byNameSt,n+'|'+normSt(c.street),c.id); });
  });
  const one = a => a && a.length===1 ? a[0] : null;
  return w => {
    const ph=d10(w.phone); if(ph.length===10 && byPhone.has(ph)) return byPhone.get(ph)[0];
    if(w.email && byEmail.has(w.email.toLowerCase())) return byEmail.get(w.email.toLowerCase())[0];
    for(const n of [normNm(w.name), normNm(w.company)].filter(Boolean)){
      if(w.street){ const hit=one(byNameSt.get(n+'|'+normSt(w.street))); if(hit) return hit; }
      const hit=one(byName.get(n)); if(hit) return hit;
    }
    return null;
  };
}
function jobRowWho(g){

  if(!first && !last){ const nm=g('customer'); if(nm){ if(/,\s*(inc|llc|co|corp|ltd)\.?$/i.test(nm)) first=nm; else { const sp=splitName(nm); first=sp.first; last=sp.last; } } }

  const name=[first,last].filter(Boolean).join(' ');

function planJobImport(){

  IMP.rows.forEach((r,ri)=>{
    const g = k => (IMP.map[k]!=null) ? String(r[IMP.map[k]]??'').trim() : '';
    const who=jobRowWho(g);
    if(!who.name && !who.company && d10(who.phone).length!==10 && !who.email){ if(r.some(c=>String(c).trim())) noCust++; return; }
    const date=parseDateAny(g('date')); if(!date){ noDate++; return; }
    const time=parseTimeAny(g('time')) || parseTimeAny(String(g('date')).replace(/^\S+/,''));
    let cid=match(who), pk=null;
    if(!cid){
      if(!IMP.createCust){ unmatched++; return; }
      pk = d10(who.phone).length===10 ? 'p'+d10(who.phone) : who.email ? 'e'+who.email : 'n'+normNm(who.name||who.company)+'|'+normSt(who.street);
      if(!newCust.has(pk)) newCust.set(pk, {name:who.name, firstName:who.first, lastName:who.last, company:who.company, phone:who.phone, email:who.email, street:who.street, city:who.city, state:who.state, zip:who.zip, status:'Active', type:normType('',who.company), frequency:'none', tags:[], importedFrom:IMP.fileName, createdAt:Date.now(), updatedAt:Date.now()});
    }
    const ck = cid ? 'c:'+cid : 'n:'+pk;
    const gk = IMP.combine ? ck+'|'+date : 'row'+ri;
    let grp=groups.get(gk);
    if(!grp){ grp={ck, cid, pk, date, time:'', statusRaw:'', crew:'', hours:'', notes:[], items:[], totalOnly:null}; groups.set(gk,grp); order.push(gk); }
    if(time && !grp.time) grp.time=time;
    if(g('status') && !grp.statusRaw) grp.statusRaw=g('status');
    if(g('crew') && !grp.crew) grp.crew=g('crew');
    const hr=numAny(g('hours')); if(hr!=null && grp.hours==='') grp.hours=hr;
    const nt=g('notes'); if(nt && !grp.notes.includes(nt)) grp.notes.push(nt);
    const svc=g('service'), q=numAny(g('qty')), rt=numAny(g('rate')), amt=numAny(g('amount'));
    const sv = svc ? svcs.find(x=>x.name.toLowerCase()===svc.toLowerCase()) : null;
    const desc = sv ? sv.name : (svc || 'Window cleaning');
    let item=null;
    if(rt!=null) item={desc, qty: q!=null?q:1, rate:rt};
    else if(amt!=null) item = (q!=null && q>0) ? {desc, qty:q, rate:Math.round(amt/q*10000)/10000} : {desc, qty:1, rate:amt};
    else if(sv) item={desc, qty: q!=null?q:1, rate:+sv.price||0};

  const jobs=[]; let dup=0;

}
async function saveMany(col, docs, onEach){
  let i=0, done=0, failed=0, lastErr=null, stop=false; const ids=new Array(docs.length);

      const ix=i++; const id=newId(col); let tries=0;
      for(;;){
        try{ await saveDoc(col, id, docs[ix]); ids[ix]=id; done++; break; }
        catch(e){ if((e.code==='resource_exhausted'||e.code==='unavailable') && tries<5){ tries++; await new Promise(r=>setTimeout(r, 700*tries+Math.random()*500)); continue; } failed++; lastErr=e; if(e.code==='quota_exceeded'||e.code==='invalid_argument') stop=true; break; }
      }
      onEach && onEach();
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  return {ids, done, failed: docs.length-done, lastErr};
}

  else if(t.id==='vl-receipt'){ const n=$('#vl-receipt-name'); if(n) n.textContent = t.files&&t.files[0] ? `Selected: ${t.files[0].name}` : ''; }
  else if(t.classList && t.classList.contains('team-role')){ const id=t.dataset.id, role=t.value; callFn('team',{action:'update', id, role}).then(r=>{ if(!r.ok){ toast(r.error,'bad'); loadTeam(); } else { toast('Role updated'); loadTeam(); } }); }
  else if(t.id==='wipe-photos'){ S.wipe.photos=t.checked; }
  else if(t.id==='wipe-messages'){ S.wipe.messages=t.checked; }
  else if(t.id==='rep-pick'){ S.rep.id=t.value; render(); }
  else if(t.id==='rep-period'){ S.rep.period=t.value; if(t.value==='custom'&&!S.rep.from){ const P=repPeriod(); S.rep.from=P.from; S.rep.to=P.to; } render(); }
  else if(t.id==='rep-from'){ S.rep.from=t.value; render(); }
  else if(t.id==='rep-to'){ S.rep.to=t.value; render(); }
  else if(t.id==='tr-tpl'){ const tpl=settings().templates.find(x=>x.name===t.value); if(tpl){ const k=t.form.dataset.k; const cid=k.startsWith('c:')?k.slice(2):''; $('#tr-body').value=fillTemplate(tpl.text, cid, {}); } }
  else if(t.id==='cal-q'){ S.cal.showQuotes=t.checked; render(); }
  else if(t.id==='imp-file'){ const f=t.files&&t.files[0]; t.value=''; if(f) readImportFile(f); }
  else if(t.classList.contains('imp-map')){ IMP.map[t.dataset.field] = t.value===''?null:+t.value; openDrawer('importCust',{},true); }
  else if(t.id==='imp-sheet'){ setImpSheet(+t.value); openDrawer('importCust',{},true); }
  else if(t.id==='imp-def'){ IMP.defStatus=t.value; openDrawer('importCust',{},true); }
  else if(t.id==='imp-dup'){ IMP.skipDup=t.checked; openDrawer('importCust',{},true); }
  else if(t.id==='imp-create'){ IMP.createCust=t.checked; openDrawer('importCust',{},true); }
  else if(t.id==='imp-combine'){ IMP.combine=t.checked; openDrawer('importCust',{},true); }
  else if(t.id==='xj-status'||t.id==='xj-from'||t.id==='xj-to'){ const n=jobsForExport().length; const el=$('#xj-count'); if(el) el.textContent=`${n} job${n===1?'':'s'} match.`; }
  else if(t.classList.contains('it-svc') && t.value!==''){ const s=settings().services[+t.value]; const r=t.closest('.item-row'); r.querySelector('.it-desc').value=s.name; r.querySelector('.it-rate').value=s.price; recalcItems(); }
  else if(t.id==='e-tpl' || t.id==='e-cust'){
    const f=t.form; const cid=$('#e-cust').value; const c=cust(cid); const tpl=settings().emailTemplates.find(x=>x.name===$('#e-tpl').value);
    if(t.id==='e-cust') $('#e-to').value = c?.email||'';
    if(tpl){ $('#e-subj').value=fillTemplate(tpl.subject, cid, {jobId:f.dataset.job, invId:f.dataset.inv}); $('#e-body').value=fillTemplate(tpl.body, cid, {jobId:f.dataset.job, invId:f.dataset.inv}); }
    updateMailto();
  }
  else if(t.id==='m-tpl' || t.id==='m-cust'){
    const f=t.form; const cid=$('#m-cust').value; const tpl=settings().templates.find(x=>x.name===$('#m-tpl').value);
    if(t.id==='m-cust') $('#m-to').innerHTML=toLine(cust(cid));
    if(tpl) $('#m-body').value=fillTemplate(tpl.text, cid, {jobId:f.dataset.job, invId:f.dataset.inv});
    $('#m-count').textContent=$('#m-body').value.length+' characters'; updateSmsLink();
  }
});
document.addEventListener('keydown', e=>{
  const t=e.target;
  if(t.classList && t.classList.contains('cpick-q')){
    const id=t.dataset.for; const {list}=cpickEls(id); const open=!list.hidden;
    if(e.key==='ArrowDown'){ e.preventDefault(); open ? cpickMove(t,1) : cpickRender(t); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); if(open) cpickMove(t,-1); return; }
    if(e.key==='Enter'){ if(open){ e.preventDefault(); const opts=list.querySelectorAll('.cpick-opt'); const o=opts[+t.dataset.active||0]; if(o) cpickChoose(id,o.dataset.id); } else e.preventDefault(); return; }
    if(e.key==='Escape' && open){ e.preventDefault(); cpickClose(id); cpickSettle(id); return; }
    if(e.key==='Tab' && open){ const opts=list.querySelectorAll('.cpick-opt'); if(t.value.trim() && opts.length){ const o=opts[+t.dataset.active||0]; if(o) cpickChoose(id,o.dataset.id); } else cpickClose(id); return; }
  }
  if(e.key==='Escape' && drawerState) back();
});
document.addEventListener('keydown', e=>{
  const t=e.target; if(!(t.classList && t.classList.contains('set-tab'))) return;
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
  const tabs=[...document.querySelectorAll('.set-tab')]; let i=tabs.indexOf(t);
  i = e.key==='Home'?0 : e.key==='End'?tabs.length-1 : (i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
  e.preventDefault(); tabs[i].focus(); tabs[i].click();
});
document.addEventListener('focusin', e=>{ const t=e.target; if(t.classList && t.classList.contains('cpick-q')){ if(!document.getElementById(t.dataset.for).value) cpickRender(t); else try{ t.select(); }catch(_){} } });
document.addEventListener('focusout', e=>{ const t=e.target; if(t.classList && t.classList.contains('cpick-q')){ const id=t.dataset.for; setTimeout(()=>{ if(document.activeElement!==t){ cpickClose(id); cpickSettle(id); } }, 160); } });
/* chart tooltip */
function chartTip(e){
  const h=e.target.closest && e.target.closest('.hit'); let tip=document.getElementById('chart-tip');
  if(!h){ if(tip) tip.hidden=true; return; }
  if(!tip){ tip=document.createElement('div'); tip.id='chart-tip'; tip.className='chart-tip'; document.body.appendChild(tip); }
  const [head,...lines]=h.dataset.tip.split('|');
  tip.innerHTML=`<strong>${esc(head)}</strong>${lines.map(l=>`<span>${esc(l)}</span>`).join('')}`; tip.hidden=false;
  const x=Math.min(window.innerWidth-tip.offsetWidth-8, e.clientX+14), y=Math.max(8, e.clientY-tip.offsetHeight-10);
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
document.addEventListener('mousemove', chartTip);
document.addEventListener('touchstart', e=>chartTip(e.touches?{target:e.target, clientX:e.touches[0].clientX, clientY:e.touches[0].clientY}:e), {passive:true});
/* calendar drag & drop */
let dragPayload=null;
document.addEventListener('dragstart', e=>{ const el=e.target.closest && e.target.closest('[data-drag]'); if(!el) return; dragPayload=el.dataset.drag; try{ e.dataTransfer.setData('text/plain', dragPayload); e.dataTransfer.effectAllowed='move'; }catch(_){} el.classList.add('dragging'); });
document.addEventListener('dragend', e=>{ dragPayload=null; document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over')); });
document.addEventListener('dragover', e=>{ if(!dragPayload) return; const cell=e.target.closest && e.target.closest('[data-date]'); if(!cell) return; e.preventDefault(); if(!cell.classList.contains('over')){ document.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); cell.classList.add('over'); } });
document.addEventListener('drop', e=>{ const cell=e.target.closest && e.target.closest('[data-date]'); if(!cell||!dragPayload) return; e.preventDefault(); const payload=dragPayload; dragPayload=null; document.querySelectorAll('.over,.dragging').forEach(x=>x.classList.remove('over','dragging')); calDrop(payload, cell.dataset.date); });
async function calDrop(payload, date){
  const i=payload.indexOf(':'); const kind=payload.slice(0,i), id=payload.slice(i+1);
  if(kind==='cust'){ S.cal.sel=date; go('jobForm',{cid:id, date}); return; }
  const j=job(id); if(!j) return;
  if(kind==='job'){
    if(j.date===date) return;
    await write(()=>saveDoc('jobs',j.id,{...j, date, updatedAt:Date.now()}), `${j.status==='Quoted'?'Quote':'Job'} moved to ${fmtDate(date)}`);
  } else if(kind==='quote'){
    const ok=await write(()=>saveDoc('jobs',j.id,{...j, date, status:'Scheduled', updatedAt:Date.now()}), `Booked ${custLabel(cust(j.customerId))} for ${fmtDate(date)}`);
    const c=cust(j.customerId); if(ok && c && (c.status==='Lead'||c.status==='Quoted')) await write(()=>saveDoc('customers',c.id,{...c,status:'Active',updatedAt:Date.now()}));
  }
}
document.addEventListener('mousedown', e=>{ const o=e.target.closest('.cpick-opt'); if(o){ e.preventDefault(); const id=o.closest('.cpick-list').id.replace(/-list$/,''); cpickChoose(id, o.dataset.id); } });
window.addEventListener('resize', ()=>document.querySelectorAll('input[data-cmp]').forEach(updateCmp));

/* ---------- sign-in & boot ---------- */
function authCard(inner){ return `<div class="auth"><div class="auth-card"><div class="auth-brand">${LOGO}<span>${esc(settings().businessName==='Your Window Co.'?'PureWash':settings().businessName)}</span></div>${inner}</div></div>`; }
function showAuth(mode, msg){
  document.getElementById('app').hidden=true; const root=document.getElementById('auth-root'); root.hidden=false;
  if(mode==='setup') root.innerHTML=authCard(`<div><h1>Create the owner account</h1><p class="muted" style="margin-top:6px">This is the first sign-in. The account you create here becomes the owner, with access to everything.</p></div>
    ${msg?`<div class="notice ${/check your email/i.test(msg)?'info':'bad'}">${esc(msg)}</div>`:''}
    <form data-form="setup" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="su-name">Your name</label><input type="text" id="su-name" name="name" required autocomplete="name"></div>
      <div class="field"><label for="su-email">Email</label><input type="email" id="su-email" name="email" required autocomplete="email"></div>
      <div class="field"><label for="su-pw">Password</label><input type="password" id="su-pw" name="pw" minlength="8" required autocomplete="new-password"><span class="hint">At least 8 characters.</span></div>
      <button class="btn primary" type="submit">Create owner account</button>
      <button class="btn ghost" type="button" data-act="authSignin">I already have an account</button>
    </form>`);
  else if(mode==='noaccess') root.innerHTML=authCard(`<div><h1>No access yet</h1><p class="muted" style="margin-top:6px">You're signed in as <strong>${esc(msg||'')}</strong>, but this account hasn't been given access, or it was turned off. Ask the owner to add you under Settings → Team.</p></div><button class="btn" data-act="signOut">Sign out</button>`);
  else if(mode==='error') root.innerHTML=authCard(`<div><h1>Can't connect</h1><p class="muted" style="margin-top:6px">${esc(msg||'The app could not reach its server. Check your internet connection and refresh the page.')}</p></div><button class="btn primary" onclick="location.reload()">Try again</button>`);
  else root.innerHTML=authCard(`<div><h1>Sign in</h1></div>
    ${msg?`<div class="notice bad">${esc(msg)}</div>`:''}
    <form data-form="signin" style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label for="si-email">Email</label><input type="email" id="si-email" name="email" required autocomplete="username"></div>
      <div class="field"><label for="si-pw">Password</label><input type="password" id="si-pw" name="pw" required autocomplete="current-password"></div>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="hint">Forgot your password? Ask the owner to reset it under Settings → Team.</p>
    </form>`);
  const f=root.querySelector('input'); if(f) f.focus();
}
A.authSignin = () => showAuth('signin');
F.signin = async f => {
  const fd=Object.fromEntries(new FormData(f));
  const {data, error}=await sb.auth.signInWithPassword({email:fd.email.trim(), password:fd.pw});
  if(error) return showAuth('signin', /invalid/i.test(error.message)?'That email and password don\'t match. Check them and try again.':/confirm/i.test(error.message)?'Confirm your email address first, using the link we sent you.':error.message);
  await enterApp(data.session);
};
F.setup = async f => {
  const fd=Object.fromEntries(new FormData(f));
  const {data, error}=await sb.auth.signUp({email:fd.email.trim(), password:fd.pw, options:{data:{full_name:fd.name.trim()}}});
  if(error) return showAuth('setup', error.message);
  if(!data.session) return showAuth('setup', 'Check your email for a confirmation link, then come back and sign in.');
  await enterApp(data.session);
};
async function loadTable(t){ let all=[], from=0; for(;;){ const {data, error}=await sb.from(t).select('id,data').range(from, from+999); if(error) throw error; all=all.concat(data||[]); if(!data || data.length<1000) break; from+=1000; } return all; }
async function loadTeam(){ const {data}=await sb.from('profiles').select('*'); S.team=data||[]; scheduleRender(); }
async function loadAll(){
  S.dbState='connecting'; render();
  try{
    const tabs=['customers','jobs','invoices','photos','messages','vehicles','vehicle_logs'];
    const res=await Promise.all(tabs.map(t=>loadTable(t).catch(()=>[])));
    tabs.forEach((t,i)=>{ STORE[t]=new Map(res[i].map(r=>[r.id,{id:r.id, ...(r.data||{})}])); S[t]=[...STORE[t].values()]; });
    const st=await sb.from('settings').select('data').eq('id','app').maybeSingle(); S.settingsDoc = st.data ? st.data.data : null;
    await loadTeam();
    S.dbState='ok';
  }catch(e){ S.dbState='off'; }
  render();
}
function applyChange(t, p){
  if(t==='settings'){ if(p.new && p.new.id==='app'){ S.settingsDoc=p.new.data; scheduleRender(); } return; }
  if(t==='profiles'){ if(p.new && p.new.id===S.uid && (p.new.role!==S.role || !p.new.active)){ location.reload(); return; } loadTeam(); return; }
  const m=STORE[t]; if(!m) return;
  if(t==='messages' && p.eventType==='INSERT' && p.new && p.new.data && p.new.data.direction==='in' && !p.new.data.read){ const d=p.new.data; const c=msgCustomerId(d); toast(`New text from ${c?custLabel(cust(c)):fmtNum(d.number)}`); }
  if(p.eventType==='DELETE'){ if(p.old && p.old.id) m.delete(p.old.id); } else if(p.new){ m.set(p.new.id, {id:p.new.id, ...(p.new.data||{})}); }
  S[t]=[...m.values()]; scheduleRender();
}
function subscribe(){
  const ch=sb.channel('purewash-live');
  ['customers','jobs','invoices','photos','messages','vehicles','vehicle_logs','settings','profiles'].forEach(t=>ch.on('postgres_changes',{event:'*', schema:'public', table:t}, p=>applyChange(t,p)));
  ch.subscribe(status=>{ if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){ setTimeout(()=>{ sb.removeChannel(ch); subscribe(); loadAll(); }, 5000); } });
}
async function importOldPhotos(){
  if(!['owner','office'].includes(S.role)) return;
  const {data}=await sb.from('photo_import').select('id').limit(200); if(!data || !data.length) return;
  let n=0;
  for(const {id} of data){
    const {data:row}=await sb.from('photo_import').select('id,mime,b64').eq('id',id).maybeSingle(); if(!row) continue;
    const bin=atob(row.b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const {error}=await sb.storage.from('photos').upload(row.id, new Blob([bytes],{type:row.mime}), {contentType:row.mime, upsert:true});
    if(!error){ await sb.from('photo_import').delete().eq('id',row.id); PH.url.delete(row.id); n++; }
  }
  if(n){ toast(`${n} photo${n===1?'':'s'} moved over from the old app`); scheduleRender(); }
}
async function enterApp(session){
  S.uid=session.user.id;
  const {data:prof, error}=await sb.from('profiles').select('*').eq('id',S.uid).maybeSingle();
  if(error) return showAuth('error');
  if(!prof || !prof.active) return showAuth('noaccess', session.user.email);
  S.profile=prof; S.role=prof.role; S.canWrite=true; S.canAdmin=prof.role==='owner';
  document.body.className='role-'+prof.role;
  document.getElementById('auth-root').hidden=true; document.getElementById('auth-root').innerHTML=''; document.getElementById('app').hidden=false;
  await loadAll(); subscribe();
  callFn('messaging',{action:'status'}).then(r=>{ if(r.ok){ S.integ={email:!!r.email, sms:!!r.sms}; S.mapsKey=r.mapsKey||null; scheduleRender(); } });
  if(prof.role==='owner') loadApis();
  importOldPhotos();
}
(async function start(){
  if(!window.supabase){ await new Promise(res=>{ const sc=document.createElement('script'); sc.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'; sc.onload=res; sc.onerror=res; document.head.appendChild(sc); }); }
  if(!window.supabase) return showAuth('error');
  sb=window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') location.reload(); });
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session) return enterApp(session);
    const {data:need}=await sb.rpc('setup_needed');
    showAuth(need ? 'setup' : 'signin');
  }catch(e){ showAuth('error'); }
})();
</script>
